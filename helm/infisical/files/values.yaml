---
# Helm chart: infisical-standalone
# Helm repository: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
# Helm chart version: 1.9.0

infisical:
  enabled: true
  name: << release_name >>
  replicaCount: << replica_count >>

  image:
    repository: infisical/infisical
    tag: "v0.158.0"
    pullPolicy: IfNotPresent

  # This Kubernetes Secret must contain AUTH_SECRET, ENCRYPTION_KEY,
  # and connection credentials. Provision it outside Boilerplates.
  kubeSecretRef: << infisical_secret_name >>

  service:
    type: << service_type >>

  extraEnv:
    - name: SITE_URL
      value: "<< infisical_site_url >>"
    <%- if infisical_allow_internal_ip_connections %>
    - name: ALLOW_INTERNAL_IP_CONNECTIONS
      value: "true"
    <%- endif %>
    <%- if email_enabled %>
    - name: SMTP_HOST
      value: "<< email_host >>"
    - name: SMTP_PORT
      value: "<< email_port >>"
    - name: SMTP_FROM_ADDRESS
      value: "<< email_from_address >>"
    - name: SMTP_FROM_NAME
      value: "<< email_from_name >>"
    - name: SMTP_USERNAME
      value: "<< email_username >>"
    - name: SMTP_SECURE
      value: "<< email_secure | lower >>"
    - name: SMTP_REQUIRE_TLS
      value: "<< email_require_tls | lower >>"
    - name: SMTP_IGNORE_TLS
      value: "<< email_ignore_tls | lower >>"
    <%- endif %>

  autoBootstrap:
    enabled: false

  serviceAccount:
    create: true

  resources:
    requests:
      cpu: << resources_cpu_request >>
      memory: << resources_memory_request >>
    limits:
      memory: << resources_memory_limit >>

<%- if ingress_enabled %>
ingress:
  enabled: true
  hostName: << ingress_host >>
  ingressClassName: << ingress_class_name >>
  nginx:
    enabled: << ingress_nginx_enabled | lower >>
  annotations:
    <%- if traefik_entrypoint %>
    traefik.ingress.kubernetes.io/router.entrypoints: << traefik_entrypoint >>
    <%- endif %>
    <%- if ingress_tls_enabled %>
    traefik.ingress.kubernetes.io/router.tls: "true"
    <%- endif %>
    <%- if ingress_certmanager_enabled %>
    cert-manager.io/cluster-issuer: << certmanager_issuer >>
    <%- endif %>
  <%- if ingress_tls_enabled %>
  tls:
    - secretName: << ingress_tls_secret >>
      hosts:
        - << ingress_host >>
  <%- endif %>
<%- else %>
ingress:
  enabled: false
<%- endif %>

ingress-nginx:
  enabled: << ingress_nginx_enabled | lower >>

# Chart 1.9.0 embeds bundled database credentials in connection URLs.
# Deploy PostgreSQL and Redis separately; keep connection URLs in existing Secrets.
postgresql:
  enabled: false
  useExistingPostgresSecret:
    enabled: true
    existingConnectionStringSecret:
      name: << database_secret_name >>
      key: DB_CONNECTION_URI
redis:
  enabled: false
